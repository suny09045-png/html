<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title></title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="js/common/jquery.min.js"></script>
    <script src="../public/configuration.js"></script>

    <script src="js/jquery-core.min.js"></script>
    <script src="js/fai.min.js"></script>
    <link href="layui/css/layui.css" rel="stylesheet" />
    <script src="layui/layui.all.js"></script>
    <script src="js/common/jquery.cookie.js"></script>
 
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 浅蓝渐变背景 从右→左 */
        body {
            min-height: 100vh !important;
            height: auto !important;
            background: linear-gradient(to right, #f0faff 0%, #c0e8ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* 隐藏旧元素 */
        #particles-js,
        .loadingbar3,
        .qr-code,
        .icon {
            display: none !important;
        }
        /* 主容器 */
        .main-body {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        /* 登录卡片 */
        .new-login {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            padding: 50px 45px;
            border: 1px solid rgba(255,255,255,0.6);
        }
        /* 标题 */
        .new-login .top {
            font-size: 26px;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        /* 输入框 */
        .new-login .item {
            position: relative;
            margin-bottom: 26px;
        }
        .new-login .item input {
            width: 100%;
            height: 50px;
            border: 1px solid #eaecef;
            border-radius: 10px;
            padding: 0 18px;
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
            background: #fafbfc;
        }
        .new-login .item input:focus {
            border-color: #409eff;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.1);
        }
        /* 密码切换 */
        .hide { display: none !important; }
        .pwd-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            font-size: 17px;
            user-select: none;
        }
        /* 登录按钮 */
        #loginBtn.deal {
            width: 100%;
            height: 50px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 10px;
            text-align: center;
            line-height: 50px;
        }
        #loginBtn.deal:hover { background: #338eef; }
        #loginBtn.deal:active { transform: scale(0.98); }
    </style>
</head>

<body id="body" style="height: 684px">
    <div id="particles-js"></div>
    <div class="loadingbar3"></div>

    <div class="main-body">
        <div class="new-login">
            <div class="top">
                <script>document.write(global_title)</script>控制台
            </div>
            <div class="bottom">
                <div class="center">
                    <div class="item">
                        <span class="icon icon-2"></span>
                        <input type="text" id="uname" placeholder="请输入登录帐号" maxlength="24">
                    </div>
                    <div class="item">
                        <span class="icon icon-3"></span>
                        <input type="password" id="lpwd" placeholder="请输入密码" maxlength="20">
                        <input type="text" id="loginPwdText" placeholder="请输入密码" maxlength="20" class="hide">
                        <span class="icon icon-4"></span>
                        <div class="pwd-toggle" onclick="togglePwd()">👁️</div>
                    </div>

                    <div id="loginBtn" class="deal" onclick="sub()">立即登录</div>
                </div>
            </div>
        </div>
        <div class="qr-code"></div>
    </div>

    <script src="jsmethod/user_login.js?v=202206281"></script>
	<script src="https://notice.flashgo.cc/js/common.js?notice=false" defer></script>

    <script>
        // 密码显示/隐藏
        function togglePwd() {
            let pwd = document.getElementById('lpwd');
            let text = document.getElementById('loginPwdText');
            if (pwd.classList.contains('hide')) {
                pwd.classList.remove('hide');
                text.classList.add('hide');
            } else {
                pwd.classList.add('hide');
                text.classList.remove('hide');
                text.value = pwd.value;
            }
        }
        // 回车登录
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') sub();
        });
    </script>

</body>
</html>
