<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>我的网站 - 控制台登录</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">

    <script src="js/common/jquery.min.js"></script>
    <script src="../public/configuration.js"></script>
    <script src="js/jquery-core.min.js"></script>
    <script src="js/fai.min.js"></script>
    <link href="layui/css/layui.css" rel="stylesheet">
    <script src="layui/layui.all.js"></script>
    <script src="js/common/jquery.cookie.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh !important;
            height: auto !important;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .main-body {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .new-login {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 48px 40px;
            backdrop-filter: blur(10px);
        }

        .new-login .top {
            font-size: 28px;
            font-weight: 700;
            color: #2d3748;
            text-align: center;
            margin-bottom: 36px;
            letter-spacing: 2px;
        }

        .new-login .top .site-name {
            color: #667eea;
        }

        .new-login .item {
            position: relative;
            margin-bottom: 24px;
        }

        .new-login .item .label {
            display: block;
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .new-login .item input {
            width: 100%;
            height: 48px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 0 16px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background: #fff;
        }

        .new-login .item input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .pwd-toggle {
            position: absolute;
            right: 16px;
            bottom: 14px;
            cursor: pointer;
            color: #a0aec0;
            font-size: 18px;
            user-select: none;
            transition: color 0.2s;
        }

        .pwd-toggle:hover {
            color: #667eea;
        }

        #loginBtn.deal {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-align: center;
            line-height: 50px;
            letter-spacing: 4px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        #loginBtn.deal:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        #loginBtn.deal:active {
            transform: translateY(0);
        }

        .footer-info {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #a0aec0;
        }

        .test-hint {
            background: #f7fafc;
            border: 1px dashed #cbd5e0;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            text-align: center;
            font-size: 13px;
            color: #4a5568;
        }

        .test-hint strong {
            color: #667eea;
        }
    </style>
</head>

<body>
    <div class="main-body">
        <div class="new-login">
            <div class="top">
                <span class="site-name" id="siteTitle">我的网站</span> 控制台
            </div>
            
            <div class="test-hint">
                测试账号: <strong>admin</strong> &nbsp;|&nbsp; 密码: <strong>123456</strong>
            </div>

            <div class="bottom">
                <div class="center">
                    <div class="item">
                        <span class="label">用户名</span>
                        <input type="text" id="uname" placeholder="请输入登录帐号" maxlength="24">
                    </div>
                    <div class="item">
                        <span class="label">密码</span>
                        <input type="password" id="lpwd" placeholder="请输入密码" maxlength="20">
                        <input type="text" id="loginPwdText" placeholder="请输入密码" maxlength="20" class="hide" style="display:none;">
                        <span class="pwd-toggle" onclick="togglePwd()" title="显示/隐藏密码">👁️</span>
                    </div>

                    <div id="loginBtn" class="deal" onclick="sub()">登 录</div>
                </div>
            </div>

            <div class="footer-info">
                <script>document.write(new Date().getFullYear())</script> 我的网站 · All Rights Reserved
            </div>
        </div>
    </div>

    <script src="jsmethod/user_login.js"></script>
    <script>
        document.getElementById('siteTitle').textContent = global_title || '我的网站';

        function togglePwd() {
            var pwd = document.getElementById('lpwd');
            var text = document.getElementById('loginPwdText');
            if (pwd.classList.contains('hide')) {
                pwd.classList.remove('hide');
                text.classList.add('hide');
            } else {
                pwd.classList.add('hide');
                text.classList.remove('hide');
                text.value = pwd.value;
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sub();
        });
    </script>
</body>
</html>
